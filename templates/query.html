{% extends "base.html" %}

{% block title %}Ask a Question{% endblock %}

{% block content %}
<section class="query-page">
    <div class="query-header">
        <h2>Ask a Question</h2>
        <a href="/dashboard" class="btn-secondary">Dashboard</a>
    </div>

    <form class="query-form"
          hx-post="/ui/query"
          hx-target="#conversation"
          hx-swap="afterbegin"
          hx-indicator="#query-indicator"
          hx-on::after-request="this.querySelector('textarea').value = ''">
        <label for="question">Question</label>
        <textarea id="question" name="question" rows="3"
                  placeholder="e.g. What patterns emerge around CI pipeline friction?"
                  autocomplete="off"></textarea>
        <div class="query-actions">
            <button type="submit">Ask</button>
            <span id="query-indicator" class="htmx-indicator">Thinking…</span>
        </div>
    </form>

    <div id="conversation" class="conversation">
    </div>
</section>
{% endblock %}
